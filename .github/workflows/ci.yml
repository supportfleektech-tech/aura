name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt "edge-tts>=7.0"
      - run: python3 -m compileall -q backend/app
      - run: |
          cd backend
          AURA_DATA_DIR="$(mktemp -d)" OLLAMA_BASE_URL=http://127.0.0.1:1 python3 -m unittest discover -s tests
      - run: python3 scripts/eval_router.py
      - run: python3 scripts/eval_agent.py --no-record

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npx vitest run
      - run: cd frontend && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: frontend/dist }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: cd frontend && npm ci && npm run build
      - run: |
          cd backend && nohup python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uv.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/me && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/me
      - run: python3 scripts/e2e_check.py
      - run: python3 scripts/prod_check.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - run: cd frontend && npm audit --omit=dev
      - run: cd frontend && npm audit || true  # dev-only advisories report without blocking

  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/migration_check.py --self-test
      - run: python3 scripts/migration_check.py
