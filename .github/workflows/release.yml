name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt "edge-tts>=7.0"
      - run: cd frontend && npm ci
      - run: |
          cd backend
          AURA_DATA_DIR="$(mktemp -d)" OLLAMA_BASE_URL=http://127.0.0.1:1 python3 -m unittest discover -s tests
      - run: python3 scripts/eval_router.py
      - run: python3 scripts/eval_agent.py --no-record
      - run: cd frontend && npx tsc --noEmit && npx vitest run && npm run build
      - run: |
          VER="${GITHUB_REF_NAME#v}"
          tar -czf aura-os-dist-${VER}.tar.gz -C frontend dist
          sha256sum aura-os-dist-${VER}.tar.gz > aura-os-dist-${VER}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            aura-os-dist-*.tar.gz
            aura-os-dist-*.tar.gz.sha256
